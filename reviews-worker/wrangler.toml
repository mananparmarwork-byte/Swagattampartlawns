name = "swagattam-reviews"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Runs a review sync every 12 hours (UTC): 00:00 and 12:00.
[triggers]
crons = ["0 */12 * * *"]

# 1) Create once:   npx wrangler kv namespace create REVIEWS_KV
# 2) Paste the printed id below.
[[kv_namespaces]]
binding = "REVIEWS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Non-secret settings. Secrets (API keys, OAuth tokens) are NOT here — see SETUP.md.
[vars]
# Who may call /api/reviews from a browser (comma separated, no trailing slash).
ALLOWED_ORIGINS = "https://swagattampartylawns.in,https://www.swagattampartylawns.in,http://localhost:5173"
# Public listing link used by the "Read All Reviews on Google" button.
GOOGLE_MAPS_URL = "https://maps.app.goo.gl/EpFZA2uc5qEnWgeA9"
# Place ID (public, not a secret). Derived from your Maps link — confirm it (SETUP.md, step 1).
PLACE_ID = "ChIJM_OfUyTJXzkR3_KOFDu-3vY"
# "auto" = Business Profile API if its secrets exist, otherwise Places API if a key exists.
PROVIDER = "auto"
# Show only reviews with at least this many stars on the website (1 = show everything).
MIN_STAR = "1"
MAX_REVIEWS_PUBLIC = "24"
